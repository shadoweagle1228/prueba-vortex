# Entorno local del walking skeleton: Keycloak 24 (emisor OIDC real) + Redis 7.
#
#   docker compose -f deploy/local/docker-compose.yml up -d
#
# El adaptador arranca con los valores por defecto de application.yml, que ya
# apuntan a http://localhost:8081/realms/andes-retail y a localhost:6379.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: andes-keycloak
    command:
      - start-dev
      - --import-realm
      - --http-port=8081
      - --health-enabled=true
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8081"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8081"
      - "9000:9000"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081 && echo -e 'GET /realms/andes-retail HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: andes-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
