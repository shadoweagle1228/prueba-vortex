apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-price-adapter
  namespace: andes-retail
  labels:
    app.kubernetes.io/name: stock-price-adapter
    app.kubernetes.io/part-of: andes-retail-interop
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stock-price-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stock-price-adapter
    spec:
      serviceAccountName: stock-price-adapter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: stock-price-adapter
      containers:
        - name: stock-price-adapter
          image: 000000000000.dkr.ecr.us-east-1.amazonaws.com/stock-price-adapter:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: stock-price-adapter-config
          env:
            # El resto de la configuración llega por envFrom (ConfigMap).
            # Las credenciales de SAP se sincronizan desde Secrets Manager con
            # External Secrets Operator; nunca van en claro en el manifiesto.
            - name: SAP_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: stock-price-adapter-secrets
                  key: sap-base-url
                  optional: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
